<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#4D774E"/>
  <!-- Database Relational Graphic -->
  <rect x="70" y="70" width="460" height="260" rx="16" fill="#FFFFFF"/>
  <rect x="70" y="70" width="460" height="50" rx="16" fill="#164A41"/>
  <text x="100" y="102" font-family="Inter, sans-serif" font-weight="700" font-size="16" fill="#F1B24A">MySQL Relational Schema (3NF Inventory)</text>
  
  <!-- Table 1 -->
  <rect x="100" y="140" width="180" height="150" rx="8" fill="#F8FAFC" stroke="#164A41" stroke-width="2"/>
  <rect x="100" y="140" width="180" height="30" rx="8" fill="#164A41"/>
  <text x="110" y="160" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#FFFFFF">tbl_items</text>
  <text x="110" y="190" font-family="Inter, sans-serif" font-size="11" fill="#164A41">🔑 item_id (INT PK)</text>
  <text x="110" y="210" font-family="Inter, sans-serif" font-size="11" fill="#4D774E">🔹 item_code (VARCHAR)</text>
  <text x="110" y="230" font-family="Inter, sans-serif" font-size="11" fill="#4D774E">🔹 stock_qty (INT)</text>
  <text x="110" y="250" font-family="Inter, sans-serif" font-size="11" fill="#4D774E">🔹 category_id (FK)</text>

  <!-- Table 2 -->
  <rect x="320" y="140" width="180" height="150" rx="8" fill="#F8FAFC" stroke="#4D774E" stroke-width="2"/>
  <rect x="320" y="140" width="180" height="30" rx="8" fill="#4D774E"/>
  <text x="330" y="160" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#FFFFFF">tbl_stock_log</text>
  <text x="330" y="190" font-family="Inter, sans-serif" font-size="11" fill="#164A41">🔑 log_id (INT PK)</text>
  <text x="330" y="210" font-family="Inter, sans-serif" font-size="11" fill="#4D774E">🔹 item_id (INT FK)</text>
  <text x="330" y="230" font-family="Inter, sans-serif" font-size="11" fill="#4D774E">🔹 change_type (IN/OUT)</text>
  <text x="330" y="250" font-family="Inter, sans-serif" font-size="11" fill="#4D774E">🔹 created_at (TIMESTAMP)</text>

  <!-- Relation Line -->
  <path d="M 280 200 L 320 200" stroke="#F1B24A" stroke-width="4" stroke-dasharray="6,4"/>
</svg>
