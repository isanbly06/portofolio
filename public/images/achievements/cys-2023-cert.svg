<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Certificate Background -->
  <rect width="800" height="600" fill="#FFFFFF"/>
  <rect x="20" y="20" width="760" height="560" rx="12" fill="none" stroke="#164A41" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="530" rx="8" fill="none" stroke="#9DC88D" stroke-width="2"/>
  
  <!-- Header -->
  <text x="400" y="110" font-family="Inter, sans-serif" font-weight="800" font-size="32" fill="#164A41" text-anchor="middle">SERTIFIKAT PENGHARGAAN</text>
  <text x="400" y="150" font-family="Inter, sans-serif" font-weight="600" font-size="18" fill="#4D774E" text-anchor="middle">Center for Young Scientists (CYS) — 2023</text>
  <line x1="250" y1="170" x2="550" y2="170" stroke="#F1B24A" stroke-width="3"/>

  <!-- Body -->
  <text x="400" y="230" font-family="Inter, sans-serif" font-weight="400" font-size="16" fill="#4A5568" text-anchor="middle">Diberikan secara bangga kepada:</text>
  <text x="400" y="280" font-family="Inter, sans-serif" font-weight="800" font-size="36" fill="#164A41" text-anchor="middle">IKHSAN SALSABILLY</text>

  <text x="400" y="340" font-family="Inter, sans-serif" font-weight="600" font-size="20" fill="#164A41" text-anchor="middle">Sebagai JUARA 3 (Tingkat Provinsi)</text>
  <text x="400" y="380" font-family="Inter, sans-serif" font-weight="400" font-size="15" fill="#4A5568" text-anchor="middle">Ajang Lomba Peneliti Belia Provinsi Aceh 2023</text>

  <!-- Medal Badge -->
  <circle cx="400" cy="460" r="45" fill="#9DC88D"/>
  <circle cx="400" cy="460" r="38" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="400" y="468" font-family="Inter, sans-serif" font-weight="800" font-size="22" fill="#164A41" text-anchor="middle">3rd</text>
</svg>
