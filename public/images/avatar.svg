<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164A41" />
      <stop offset="100%" stop-color="#4D774E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1B24A" />
      <stop offset="100%" stop-color="#9DC88D" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="url(#avatarGrad)"/>
  <!-- Decorative background circles -->
  <circle cx="340" cy="60" r="80" fill="#F1B24A" opacity="0.2" />
  <circle cx="60" cy="340" r="100" fill="#9DC88D" opacity="0.25" />
  
  <!-- Silhouette / Stylized Avatar Graphic -->
  <g transform="translate(100, 70)">
    <!-- Head -->
    <circle cx="100" cy="80" r="55" fill="#F1B24A"/>
    <!-- Glasses / Tech detail -->
    <rect x="65" y="70" width="32" height="18" rx="4" fill="#164A41"/>
    <rect x="103" y="70" width="32" height="18" rx="4" fill="#164A41"/>
    <line x1="97" y1="78" x2="103" y2="78" stroke="#164A41" stroke-width="4"/>
    <!-- Smile -->
    <path d="M 82 105 Q 100 120 118 105" fill="none" stroke="#164A41" stroke-width="5" stroke-linecap="round"/>
    <!-- Body / Shoulders -->
    <path d="M 15 230 C 15 165, 185 165, 185 230 Z" fill="#9DC88D"/>
    <!-- Shirt accent -->
    <polygon points="100,165 75,230 125,230" fill="#FFFFFF" opacity="0.3"/>
  </g>
  
  <!-- Badge Badge -->
  <g transform="translate(40, 315)">
    <rect width="180" height="45" rx="22" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
    <circle cx="25" cy="22.5" r="12" fill="#F1B24A"/>
    <text x="50" y="28" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#164A41">Tech Student PNL</text>
  </g>
</svg>
