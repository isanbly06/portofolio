<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#164A41"/>
  <!-- Pitch Lines -->
  <rect x="40" y="40" width="520" height="320" rx="12" fill="none" stroke="#4D774E" stroke-width="4"/>
  <line x1="300" y1="40" x2="300" y2="360" stroke="#4D774E" stroke-width="4"/>
  <circle cx="300" cy="200" r="60" fill="none" stroke="#4D774E" stroke-width="4"/>
  <circle cx="300" cy="200" r="6" fill="#F1B24A"/>
  
  <!-- Overlay UI Card Mockup -->
  <rect x="90" y="80" width="420" height="240" rx="16" fill="#FFFFFF" opacity="0.95"/>
  <!-- UI Header -->
  <rect x="90" y="80" width="420" height="48" rx="16" fill="#164A41"/>
  <circle cx="120" cy="104" r="6" fill="#F1B24A"/>
  <circle cx="140" cy="104" r="6" fill="#9DC88D"/>
  <circle cx="160" cy="104" r="6" fill="#FFFFFF" opacity="0.5"/>
  <text x="180" y="110" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">Sun Futsal Reservation System</text>
  
  <!-- Slot booking grid mockup -->
  <rect x="110" y="150" width="110" height="40" rx="8" fill="#F1B24A"/>
  <text x="165" y="175" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#164A41" text-anchor="middle">16:00 - Booked</text>
  
  <rect x="235" y="150" width="110" height="40" rx="8" fill="#9DC88D"/>
  <text x="290" y="175" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#164A41" text-anchor="middle">17:00 - Available</text>
  
  <rect x="360" y="150" width="110" height="40" rx="8" fill="#9DC88D"/>
  <text x="415" y="175" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#164A41" text-anchor="middle">18:00 - Available</text>

  <rect x="110" y="210" width="360" height="80" rx="8" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="130" y="240" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#164A41">Status Pemesanan Realtime</text>
  <text x="130" y="265" font-family="Inter, sans-serif" font-weight="400" font-size="12" fill="#4D774E">Laravel DB Locking Transaction • Anti Bentrok Jadwal</text>
</svg>
